[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
# Vendored dependency sources and licenses keep clean clones buildable.
libs = ["lib"]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "paris"
