<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FstSwap · 代币与 Logo 管理</title><link rel="stylesheet" href="token-admin.css"></head><body>
<header><a href="http://127.0.0.1:8124/">FstSwap</a><span>代币与 Logo 管理</span></header>
<main><section class="intro"><h1>管理代币列表</h1><p>FstSwapFinance / FstSwap <span class="chip">main</span></p><p id="connection" role="status">检查 GitHub 连接…</p></section>
<section class="toolbar"><input id="search" aria-label="搜索代币" placeholder="搜索名称、符号或合约地址"><button id="add">＋ 添加代币</button><button id="reload" class="secondary">重新载入</button><button id="review">预览并保存</button></section>
<p id="message" role="status"></p><section class="panel"><div class="list-heading"><h2>代币列表 <small id="count"></small></h2><span id="version"></span></div><div class="table-scroll"><table><thead><tr><th>代币</th><th>合约地址</th><th>精度</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<p class="note">新增代币只影响展示与选择，不改变合约收费币。Logo 使用 HTTPS 图片地址；列表发布后，GitHub 缓存刷新可能稍有延迟。</p></main>
<dialog id="editor"><form id="token-form"><h2 id="editor-title">添加代币</h2><label>合约地址<input name="address" required pattern="0x[0-9a-fA-F]{40}" placeholder="0x…"></label><div class="columns"><label>代币名称<input name="name" required maxlength="100"></label><label>符号<input name="symbol" required maxlength="40"></label></div><div class="columns"><label>网络<input value="BSC 主网 · 56" disabled></label><label>精度<input name="decimals" type="number" min="0" max="255" required value="18"></label></div><label>Logo 图片地址<input name="logoURI" type="url" placeholder="https://…/logo.png"></label><div class="logo-preview"><img id="preview-logo" alt="Logo 预览" hidden><span id="logo-status">填写地址后预览图片</span></div><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel" class="secondary">取消</button><button type="submit">保存到草稿</button></div></form></dialog>
<dialog id="review-dialog"><h2>保存到 GitHub</h2><p>以下修改将发布到 main 分支的 tokens.json。</p><pre id="diff"></pre><p id="save-error" role="alert"></p><div class="actions"><button id="back" class="secondary">返回编辑</button><button id="publish">确认保存到 GitHub</button></div></dialog>
<script type="module" src="token-admin.mjs"></script></body></html>
